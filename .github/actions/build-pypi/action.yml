# This repository's build-pypi hook, run by the hub's build-release-task.yml in place of its pypi-build-default.
# It exists because the default uploads no release asset, so the wheel and sdist reach the GitHub release only through this hook.
# Its version is the default's, the release tag's X.Y.Z taken from SemVer2's core.
# Validation is not repeated here, since both callers run the hub validate-task in the same workflow and gate their outcome on it, CI through its aggregator and the publisher through the publish job's needs.
name: Build PyPI package (aiopurpleair)
description: Build the wheel and sdist at the release tag's X.Y.Z, for the publish-pypi job and the GitHub release.

inputs:
  branch:
    description: Logical branch driving the PEP 440 version. develop gives a .dev0 prerelease, else a plain release.
    required: true
  smoke:
    description: Smoke mode skips both artifact uploads, since nothing would consume them.
    required: false
    default: 'false'
  # The hub task passes this from build-release-task.yml 2.0.613 on, so a pin below that leaves it empty and every build fails here.
  semver2:
    description: NBGV SemVer2, whose M.N.P core is the PEP 440 version source.
    required: true
  # The hub task still passes this, so it stays declared to spare every run the runner's unexpected-input warning.
  assembly-file-version:
    description: NBGV AssemblyFileVersion, unused since semver2 is the version source.
    required: false
  project-dir:
    description: Working directory of the PyPI project.
    required: true

runs:
  using: composite
  steps:

    - name: Setup uv step
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Sync dependencies step
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: uv sync --all-groups --frozen

    # The release tag's X.Y.Z is SemVer2 with its prerelease and build segments stripped, and develop appends .dev0.
    - name: Compute PyPI version step
      id: pypiver
      shell: bash
      env:
        SEMVER2: ${{ inputs.semver2 }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -Eeuo pipefail
        core="${SEMVER2%%[-+]*}"
        if [[ ! "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          # Characters outside SemVer's own set print as ?, so the value can form no workflow command.
          printf 'Received semver2: %s\n' "${SEMVER2//[^0-9A-Za-z.+-]/?}"
          echo "::error::semver2 carries no M.N.P core to build a PEP 440 version from."
          exit 1
        fi
        if [[ "$BRANCH" == "develop" ]]; then
          version="${core}.dev0"
        else
          version="$core"
        fi
        echo "PyPI version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Rewrites the placeholder hatchling reads, on the runner only, after the frozen sync so the resolve is unaffected.
    - name: Write version into _version.py step
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      env:
        VERSION: ${{ steps.pypiver.outputs.version }}
      run: |
        set -Eeuo pipefail
        sed -i 's/^__version__ = .*/__version__ = "'"$VERSION"'"/' src/aiopurpleair/_version.py
        grep -qxF "__version__ = \"$VERSION\"" src/aiopurpleair/_version.py

    - name: Build sdist and wheel step
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: uv build

    # The name publish-release's publish-pypi job downloads, and deletes once it has pushed.
    - name: Upload PyPI build artifact step
      if: ${{ inputs.smoke != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pypi-build-${{ inputs.branch }}
        path: ${{ inputs.project-dir }}/dist/*
        if-no-files-found: error
        retention-days: 1

    # The pattern the hub github-release job collects and attaches, and deletes once the release is cut.
    - name: Upload release asset artifact step
      if: ${{ inputs.smoke != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-asset-${{ inputs.branch }}-pypi
        path: ${{ inputs.project-dir }}/dist/*
        if-no-files-found: error
        retention-days: 1
