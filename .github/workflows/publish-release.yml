name: Publish project release action

# Gated publisher, where a human merge never auto-cuts a release.
# Only a push to main by an allowlisted bot does, plus a manual dispatch.
# The plan job is the single source of the release gate, and every job below gates on its output.
# The allowlist is exactly ptr727-codegen[bot] and dependabot[bot], compared against github.actor.
# The codegen App merges every bot PR, which is how a Dependabot bump reaches PyPI unattended.
# It also publishes on a workflow_dispatch of main or develop.
# Any other actor pushing to main is annotated and does not publish, a renamed or newly installed App included.
# That annotation is required rather than incidental, since a release bot under a new identity would otherwise stop publishing silently.
# The push trigger is main-only and filtered to the shipped inputs in on.push.paths below.
# Those are the library source, the package metadata, the version floor, and the locked dependency set.
# The locked dependency set is listed because a PyPI release cannot be re-pushed for the same version.
# A dependency bump must therefore republish to keep the declared dependencies current, closing the stale dependency window.
# A develop prerelease is a deliberate dispatch rather than a consequence of a merge.
# The publish job needs the same validate-task the pull request runs, so nothing publishes that would fail validation.
on:
  push:
    branches: [main]
    paths:
      - 'src/aiopurpleair/**'
      - 'pyproject.toml'
      - 'version.json'
      - 'uv.lock'
  workflow_dispatch:

# Ref-independent group so concurrent publishes serialize, and cancel-in-progress: false so a publish is
# never cancelled mid-release (a half-created GitHub release or partial PyPI upload).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# GITHUB_TOKEN gets no scope by default, and each job below grants only what its hub task or its own steps write with.
permissions: {}

jobs:

  # Single source of the release-gate decision, publish or not and stable or not, reused by every job below.
  # Hosted in the hub rather than carried, so the policy has one definition across the fleet.
  plan:
    name: Plan release job
    uses: ptr727/ProjectTemplate/.github/workflows/publish-plan-task.yml@6c88850128629bb449fd73c7fbf82968c6cd1557 # 2.0.587
    with:
      event_name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      ref_name: ${{ github.ref_name }}

  # The same lint + test gate the PR runs, on the branch tip, running only when a publish will happen.
  validate:
    name: Validate job
    needs: [plan]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@9d5a0c028997754a5156164ceff950f01b5e668f # 2.0.606
    permissions:
      contents: read
    with:
      python-versions: '["3.13", "3.14"]'
    # Named rather than inherited: the fleet forbids secrets: inherit on a cross-repository call.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Build, version, and cut the GitHub release for the triggering branch, and upload the wheel + sdist for publish-pypi.
  # The hub task declares no permissions of its own, so this job grants contents: write for the release and actions: write for its consumed-artifact cleanup.
  # The pin matches test-pull-request.yml's smoke-build job.
  publish:
    name: Publish project release job
    needs: [plan, validate]
    if: ${{ needs.plan.outputs.publish == 'true' && needs.validate.result == 'success' }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@f4e3f313ba59fa1b87595579c9a12ea9ae62450b # 2.0.610
    permissions:
      contents: write
      actions: write
    # The expect_release_assets input keeps its default, since the build-pypi hook uploads the wheel + sdist as release-asset-<branch>-pypi.
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      smoke: false
      github: true
      enable_docker: false
      enable_nuget: false
      enable_dotnet_publish: false
      pypi_project_dir: .

  # OIDC Trusted Publishing: no stored API key. Downloads this run's build artifact and uploads it to PyPI.
  # The push lives here rather than in the hub task so the OIDC token's job_workflow_ref claim names this file, which is what the PyPI trusted publisher registration names.
  # The pypi environment's deployment branch rule restricts uploads to main + develop as defense in depth.
  # A skipped publish job skips this one too, so no separate release gate is needed.
  publish-pypi:
    name: Publish PyPI library job
    needs: [validate, publish]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ptr727-aiopurpleair/
    # The grants are id-token: write for the OIDC exchange, contents: read for repo metadata, and actions: write to delete the consumed artifact.
    permissions:
      id-token: write
      contents: read
      actions: write

    steps:

      - name: Download build artifacts step
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-build-${{ github.ref_name }}
          path: ./dist

      - name: Publish to PyPI step
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ./dist
          # Skip rather than fail when the version already exists (a re-run or a no-change dispatch).
          skip-existing: true

      # Gated on the download rather than on the publish, per D5.2: a step with no if: inherits success() and would skip on exactly the failed push where the artifact is already downloaded.
      # Best-effort, since the retention-days: 1 backstop reaps anything a listing or delete hiccup leaves.
      - name: Delete consumed PyPI build artifact step
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT: pypi-build-${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          if ! ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT\") | .id"); then
            echo "::warning::Could not list PyPI build artifacts. The retention-days backstop will reap them."
            ids=""
          fi
          for id in $ids; do
            if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; then
              echo "::warning::Failed to delete artifact $id. The retention-days backstop will reap it."
            fi
          done
