name: Publish project release action

# Gated publisher, where a human merge never auto-cuts a release.
# Only a push to main by an allowlisted bot does, plus a manual dispatch.
# The plan job is the single source of the release gate, and every job below gates on its output.
# The allowlist is exactly ptr727-codegen[bot] and dependabot[bot], compared against github.actor.
# The codegen App merges every bot PR, which is how a Dependabot bump reaches PyPI unattended.
# It also publishes on a workflow_dispatch of main or develop.
# Any other actor pushing to main is annotated and does not publish, a renamed or newly installed App included.
# That annotation is required rather than incidental, since a release bot under a new identity would otherwise stop publishing silently.
# The push trigger is main-only and filtered to the shipped inputs in on.push.paths below.
# Those are the library source, the package metadata, the version floor, and the locked dependency set.
# The locked dependency set is listed because a PyPI release cannot be re-pushed for the same version.
# A dependency bump must therefore republish to keep the declared dependencies current, closing the stale dependency window.
# A develop prerelease is a deliberate dispatch rather than a consequence of a merge.
# The publish job needs the same validate-task the pull request runs, so nothing publishes that would fail validation.
on:
  push:
    branches: [main]
    paths:
      - 'src/aiopurpleair/**'
      - 'pyproject.toml'
      - 'version.json'
      - 'uv.lock'
  workflow_dispatch:

# Ref-independent group so concurrent publishes serialize, and cancel-in-progress: false so a publish is
# never cancelled mid-release (a half-created GitHub release or partial PyPI upload).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  # Single source of the release-gate decision, publish or not and stable or not, reused by every job below.
  # Hosted in the hub rather than carried, so the policy has one definition across the fleet.
  plan:
    name: Plan release job
    uses: ptr727/ProjectTemplate/.github/workflows/publish-plan-task.yml@6c88850128629bb449fd73c7fbf82968c6cd1557 # 2.0.587
    with:
      event_name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      ref_name: ${{ github.ref_name }}

  # The same lint + test gate the PR runs, on the branch tip, running only when a publish will happen.
  validate:
    name: Validate job
    needs: [plan]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ./.github/workflows/validate-task.yml
    secrets: inherit

  # Build, version, validate, and cut the GitHub release for the triggering branch, and upload the wheel +
  # sdist for publish-pypi. Grants the write scope the github-release job needs (the task declares none, so
  # the read-only smoke caller is not forced to over-grant).
  publish:
    name: Publish project release job
    needs: [plan, validate]
    if: ${{ needs.plan.outputs.publish == 'true' && needs.validate.result == 'success' }}
    uses: ./.github/workflows/build-release-task.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      publish: true
      smoke: false
      branch: ${{ github.ref_name }}

  # OIDC Trusted Publishing: no stored API key. Downloads this run's build artifact and uploads it to PyPI.
  # The pypi environment's deployment branch rule restricts uploads to main + develop as defense in depth.
  publish-pypi:
    name: Publish PyPI library job
    needs: [validate, publish]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ptr727-aiopurpleair/
    # id-token:write for Trusted Publishing's OIDC exchange, contents:read for repo metadata.
    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download build artifacts step
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aiopurpleair-build-${{ github.ref_name }}
          path: ./dist

      - name: Publish to PyPI step
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ./dist
          # Skip rather than fail when the version already exists (a re-run or a no-change dispatch).
          skip-existing: true
