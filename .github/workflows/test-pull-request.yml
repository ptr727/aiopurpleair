name: Test pull request action

# CI for every pull request, whatever its base branch.
# The validate job reaches the hub's validate-task by pin, and smoke-build proves the library still packs while publishing nothing.
# The aggregator below is the ruleset required-status-check.
# The validate job is the same gate the publisher runs, so nothing merges or publishes that would fail it.
#
# The trigger is pull_request, matching the fleet's release-with-smoke stub.
# It was push until the gates moved to the hub, and both reasons for that are spent.
# The tasks a push run resolved from the pushed head are hub-hosted and pinned now, so no local copy remains to test against itself.
# The hub's prose gate carries an `if: github.event.pull_request != null` guard, so a push-triggered run skipped it silently.
# Adopting on push would therefore have taken the fleet lint job minus one of its gates (ptr727/ProjectTemplate#1516).
#
# A fork pull request now produces a run and can satisfy the required check, where under push it produced none and had to be landed on an in-repo branch first.
# The repository's fork-PR approval policy is first_time_contributors, so a new contributor's first run still waits on a maintainer's Approve and run.
on:
  # Deliberately unfiltered by base branch, where the fleet stub names [main, develop].
  # Retargeting a pull request fires activity type `edited`, which is not in the default set, so a run does not follow a retarget.
  # A stack retargeted from a feature branch onto develop would then wait forever for a context no run will post.
  # Running on every pull request puts that context on the head SHA at `opened`, and a retarget carries it along because the head SHA does not change.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:
    name: Validate job
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@9d5a0c028997754a5156164ceff950f01b5e668f # 2.0.606
    permissions:
      contents: read
    # The interpreter matrix is this repository's rather than the task's, the hub task defaulting to ["3.13"] alone.
    # Omitting this would drop the 3.14 leg while requires-python still claims to support it.
    with:
      python-versions: '["3.13", "3.14"]'
    # Named rather than inherited: the fleet forbids secrets: inherit on a cross-repository call.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Build and pack the library in its branch configuration to prove it ships, publishing nothing.
  # This still calls the local build-release-task, which the release-chain adoption replaces with the hub's.
  smoke-build:
    name: Smoke build job
    uses: ./.github/workflows/build-release-task.yml
    permissions:
      contents: read
    with:
      smoke: true
      publish: false
      # On a pull_request event github.ref_name is the PR ref such as 123/merge, never a branch.
      # The logical branch reads base_ref first and falls back to ref_name on a non-PR trigger.
      branch: ${{ github.base_ref || github.ref_name }}

  # Single required status check, its name being the context the live branch rulesets require.
  # That context is applied from the hub's payloads, of which this repository carries no copy.
  # Renaming it starts at the hub rather than here, so a local rename alone leaves every pull request unmergeable.
  # See OPERATIONS.md "Release-Train Invariants".
  # It must succeed, not merely not-fail.
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [validate, smoke-build]
    if: ${{ always() }}
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "validate:${{ needs.validate.result }}" "smoke-build:${{ needs.smoke-build.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
